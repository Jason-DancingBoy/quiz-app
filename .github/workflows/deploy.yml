name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: pip install -q -r backend/requirements.txt
      - name: Import check
        run: |
          DEEPSEEK_API_KEY=ci-dummy BASIC_AUTH_USER=ci BASIC_AUTH_PASS=ci python -c "import backend.main"
          python -m compileall -q backend

      - name: Get version
        id: ver
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Package
        run: |
          mkdir -p pkg
          cp -r backend pkg/
          cp -r static pkg/static
          cp backend/requirements.txt pkg/requirements.txt
          cp restart.sh pkg/restart.sh
          echo "${{ steps.ver.outputs.sha }}" > pkg/.version
          tar -czf quiz-app.tar.gz -C pkg .
          ls -lh quiz-app.tar.gz

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.sha }}
          name: ${{ steps.ver.outputs.sha }}
          body: "Auto build ${{ steps.ver.outputs.sha }}"
          files: quiz-app.tar.gz
          prerelease: true

      - name: Notify N150
        continue-on-error: true
        run: |
          sleep 20
          curl -sS -X POST https://wemusic.sherlockguo.com/deploy \
            -H "Content-Type: application/json" \
            -d "{\"project\":\"quizapp\",\"version\":\"${{ steps.ver.outputs.sha }}\"}" \
            --max-time 10 --connect-timeout 5 || true
