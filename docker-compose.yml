version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-admin}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-quiz2026}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./frontend/dist:/app/static
    restart: unless-stopped
